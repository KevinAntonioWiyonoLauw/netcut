<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NetCut — network access control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b0f14'/><path d='M7 20l5-9 4 6 3-4 6 7' stroke='%2334d399' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root{
    --bg:#0b0f14; --bg2:#111823; --bg3:#16202e; --line:#22303f;
    --fg:#e6edf3; --fg2:#9fb0c3; --fg3:#6b7c8f;
    --accent:#34d399; --accent2:#22c55e;
    --warn:#fbbf24; --danger:#f87171; --info:#60a5fa; --purple:#a78bfa;
    --radius:10px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--bg); color:var(--fg); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}
  .hide{display:none !important}

  /* ---------- login ---------- */
  #login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% -10%,#13202f,var(--bg))}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:26px}
  #login .card{width:min(380px,92vw)}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.3px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  label{display:block;font-size:12px;color:var(--fg2);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.5px}
  input,select,textarea{
    width:100%;padding:9px 11px;background:var(--bg3);border:1px solid var(--line);
    border-radius:var(--radius);outline:none;transition:border-color .15s
  }
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 13px;border-radius:var(--radius);border:1px solid var(--line);
    background:var(--bg3);cursor:pointer;transition:.15s;white-space:nowrap;font-size:13px
  }
  .btn:hover{border-color:var(--fg3);background:#1b2735}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn.primary{background:var(--accent2);border-color:var(--accent2);color:#04240f;font-weight:600}
  .btn.primary:hover{background:#16a34a}
  .btn.danger{background:#3a1418;border-color:#5c2126;color:#fca5a5}
  .btn.danger:hover{background:#4a1a1f}
  .btn.warn{background:#3a2c10;border-color:#5c4620;color:#fcd34d}
  .btn.warn:hover{background:#4a3814}
  .btn.sm{padding:5px 9px;font-size:12px}
  .btn.ghost{background:transparent}
  .full{width:100%;margin-top:18px}
  .err{color:var(--danger);font-size:13px;margin-top:12px;min-height:18px}

  /* ---------- layout ---------- */
  header{
    position:sticky;top:0;z-index:20;background:rgba(11,15,20,.86);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding:11px 18px
  }
  .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .grow{flex:1}
  main{padding:18px;max-width:1500px;margin:0 auto}
  section{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}
  section>h2{
    margin:0;padding:12px 15px;font-size:13px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--fg2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:9px
  }
  section>h2 .grow{flex:1}
  .pad{padding:15px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:1px;background:var(--line)}
  .stat{background:var(--bg2);padding:13px 15px}
  .stat .k{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.6px}
  .stat .v{font-size:22px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
  .stat .v.g{color:var(--accent)} .stat .v.r{color:var(--danger)}
  .stat .v.y{color:var(--warn)} .stat .v.b{color:var(--info)}

  /* ---------- table ---------- */
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.6px;font-weight:600;background:var(--bg2);position:sticky;top:0}
  tbody tr:hover{background:#141d29}
  tbody tr.off{opacity:.5}
  tbody tr.protected{background:linear-gradient(90deg,rgba(52,211,153,.09),transparent 55%)}
  tbody tr.blocked{background:linear-gradient(90deg,rgba(248,113,113,.1),transparent 55%)}
  td.mono,.mono{font-family:var(--mono);font-size:12px}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;letter-spacing:.3px}
  .pill.on{background:rgba(52,211,153,.16);color:var(--accent)}
  .pill.off{background:rgba(107,124,143,.18);color:var(--fg2)}
  .pill.block{background:rgba(248,113,113,.18);color:#fca5a5}
  .pill.throttle{background:rgba(251,191,36,.18);color:#fcd34d}
  .pill.observe{background:rgba(96,165,250,.18);color:#93c5fd}
  .pill.allow{background:rgba(107,124,143,.14);color:var(--fg2)}
  .pill.prot{background:rgba(167,139,250,.18);color:#c4b5fd}
  .pill.wlan{background:rgba(96,165,250,.18);color:#93c5fd}
  .pill.lan{background:rgba(52,211,153,.16);color:#6ee7b7}
  .pill.wan{background:rgba(167,139,250,.16);color:#c4b5fd}
  .pill.virtual{background:rgba(107,124,143,.16);color:var(--fg2)}
  .pill.unknown{background:rgba(107,124,143,.12);color:var(--fg3)}
  .acts{display:flex;gap:5px;flex-wrap:wrap}
  .empty{padding:28px 15px;text-align:center;color:var(--fg3)}
  .bar{height:5px;border-radius:3px;background:var(--bg3);overflow:hidden;min-width:54px}
  .bar>i{display:block;height:100%;background:var(--accent)}

  /* ---------- misc ---------- */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:960px){.grid2{grid-template-columns:1fr}}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
  .kv .k{color:var(--fg3)}
  .log{max-height:340px;overflow:auto;font-family:var(--mono);font-size:12px}
  .log .e{padding:6px 15px;border-bottom:1px solid var(--line);display:flex;gap:10px}
  .log .e .t{color:var(--fg3);flex-shrink:0}
  .log .e.warn{color:#fcd34d} .log .e.alert{color:#fca5a5}
  .modal{position:fixed;inset:0;background:rgba(3,6,10,.72);display:grid;place-items:center;z-index:50;padding:16px}
  .modal .card{width:min(520px,96vw);max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 4px;font-size:16px}
  .modal .sub{color:var(--fg3);font-size:12px;margin-bottom:12px}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:100;
    background:var(--bg3);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 16px;font-size:13px;box-shadow:0 8px 28px rgba(0,0,0,.5)
  }
  .toast.ok{border-color:var(--accent2)} .toast.bad{border-color:var(--danger)}
  code{background:var(--bg3);padding:2px 6px;border-radius:5px;font-family:var(--mono);font-size:12px}
  .hint{color:var(--fg3);font-size:12px}
  .banner{padding:10px 15px;font-size:13px;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:center}
  .banner.warn{background:rgba(251,191,36,.09);color:#fcd34d}
  .banner.bad{background:rgba(248,113,113,.09);color:#fca5a5}
  .flash{animation:fl 1.1s ease-out}
  @keyframes fl{0%{background:rgba(52,211,153,.22)}100%{background:transparent}}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid var(--fg3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ============ login ============ -->
<div id="login">
  <div class="card">
    <div class="brand"><span class="dot"></span><h1>NetCut</h1></div>
    <p class="hint" style="margin:0 0 4px">Network access control for a segment you own.</p>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn primary full" type="submit">Sign in</button>
    </form>
    <div class="err" id="loginErr"></div>
  </div>
</div>

<!-- ============ app ============ -->
<div id="app" class="hide">
  <header>
    <div class="row">
      <div class="brand" style="margin:0"><span class="dot"></span><h1 style="font-size:16px">NetCut</h1></div>
      <span id="conn" class="pill off">connecting</span>
      <span id="agentPill" class="pill off">no agent</span>
      <div class="grow"></div>
      <span id="whoami" class="hint"></span>
      <button class="btn sm" id="btnRefresh">Refresh</button>
      <button class="btn sm" id="btnPolicies">Policies</button>
      <button class="btn sm" id="btnAgents">Agents</button>
      <button class="btn sm" id="btnEvents">Events</button>
      <button class="btn sm" id="btnUsers" data-role="owner">Users</button>
      <button class="btn sm" id="btnPassword">Password</button>
      <button class="btn sm warn" id="btnPanic">Panic release</button>
      <button class="btn sm danger" id="btnLogout">Sign out</button>
    </div>
  </header>

  <main>
    <div id="banners"></div>

    <section>
      <div class="stats" id="stats"></div>
    </section>

    <section>
      <h2>
        Devices
        <div class="grow"></div>
        <input id="filter" placeholder="Filter name, IP, MAC, vendor…" style="width:240px;padding:5px 9px;font-size:12px">
        <button class="btn sm" id="btnRescan">Rescan</button>
      </h2>
      <div class="tw"><table>
        <thead><tr>
          <th>Device</th><th>IP</th><th>MAC</th><th>Vendor</th><th>Link</th><th>Group</th>
          <th>State</th><th>Enforced</th><th>Down</th><th>Up</th><th>Session</th><th>Actions</th>
        </tr></thead>
        <tbody id="devices"><tr><td colspan="12" class="empty">Loading…</td></tr></tbody>
      </table></div>
    </section>
  </main>
</div>

<div id="modals"></div>
<div id="toasts"></div>

<script>
"use strict";
/* ------------------------------------------------------------------ state */
const S = {
  user: null, devices: [], decisions: {}, policies: [], overrides: {},
  stats: null, health: null, agents: [], events: [], router: null, ws: null, timer: null,
};
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmtBps(n) {
  n = Number(n) || 0;
  if (n < 1000) return n + " B/s";
  if (n < 1e6)  return (n / 1000).toFixed(1) + " KB/s";
  if (n < 1e9)  return (n / 1e6).toFixed(1) + " MB/s";
  return (n / 1e9).toFixed(2) + " GB/s";
}
function fmtBytes(n) {
  n = Number(n) || 0;
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0;
  while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
  return n.toFixed(i ? 1 : 0) + " " + u[i];
}
function fmtDur(ms) {
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + (s % 60) + "s";
  if (s < 86400) return Math.floor(s / 3600) + "h " + Math.floor((s % 3600) / 60) + "m";
  return Math.floor(s / 86400) + "d " + Math.floor((s % 86400) / 3600) + "h";
}
const ago = (t) => (!t || t.startsWith("0001") ? "—" : fmtDur(Date.now() - new Date(t).getTime()) + " ago");
const clock = (t) => (!t || t.startsWith("0001") ? "—" : new Date(t).toLocaleTimeString());

function toast(msg, kind = "") {
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ------------------------------------------------------------------ api */
async function api(path, opts = {}) {
  const init = {
    method: opts.method || "GET",
    headers: { "X-NetCut": "1" },
    credentials: "same-origin",
  };
  if (opts.body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  const res = await fetch("/api" + path, init);
  let data = null;
  const ct = res.headers.get("content-type") || "";
  if (ct.includes("application/json")) { try { data = await res.json(); } catch { /* ignore */ } }
  if (!res.ok) throw new Error((data && data.error) || (res.status + " " + res.statusText));
  return data;
}

/* ------------------------------------------------------------------ auth */
$("#loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = e.target.querySelector("button");
  btn.disabled = true;
  $("#loginErr").textContent = "";
  try {
    const r = await api("/auth/login", {
      method: "POST",
      body: { email: $("#email").value, password: $("#password").value },
    });
    S.user = r.user;
    startApp();
  } catch (err) {
    $("#loginErr").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

$("#btnLogout").addEventListener("click", async () => {
  try { await api("/auth/logout", { method: "POST" }); } catch { /* ignore */ }
  location.reload();
});

function startApp() {
  $("#login").classList.add("hide");
  $("#app").classList.remove("hide");
  $("#whoami").textContent = S.user.email + " · " + S.user.role;
  $$("[data-role]").forEach((el) => {
    if (S.user.role !== el.dataset.role) el.classList.add("hide");
  });
  connect();
  refresh();
  S.timer = setInterval(refresh, 5000);
}
function stopApp() {
  if (S.timer) clearInterval(S.timer);
  if (S.ws) { try { S.ws.close(); } catch { /* ignore */ } }
}

/* ------------------------------------------------------------------ live feed */
function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const ws = new WebSocket(proto + "//" + location.host + "/api/ws");
  S.ws = ws;
  ws.onopen = () => setConn("live", "on");
  ws.onclose = () => { setConn("reconnecting", "off"); setTimeout(connect, 2500); };
  ws.onerror = () => { try { ws.close(); } catch { /* ignore */ } };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === "state") { applyState(m); }
  };
}
function setConn(text, cls) {
  const el = $("#conn");
  el.textContent = text;
  el.className = "pill " + cls;
}

/* ------------------------------------------------------------------ render */
function applyState(m) {
  S.devices = m.devices || [];
  S.policies = m.policies || [];
  S.overrides = m.overrides || {};
  S.stats = m.stats || null;
  S.health = m.health || null;
  S.agents = m.agents || [];
  S.router = m.router || null;
  S.decisions = {};
  (m.decisions || []).forEach((d) => { S.decisions[d.mac] = d; });
  render();
}

async function refresh() {
  try {
    const st = await api("/state");
    applyState(st);
    const ev = await api("/events?limit=80");
    S.events = ev.events || [];
    renderEvents();
  } catch (err) {
    if (/401|session/.test(err.message)) { stopApp(); location.reload(); }
  }
}

function render() {
  renderStats();
  renderBanners();
  renderDevices();
}

function renderStats() {
  const s = S.stats || {};
  const h = S.health || {};
  const cells = [
    ["Devices", s.devices ?? 0, ""],
    ["Online", s.online ?? 0, "g"],
    ["Blocked", s.blocked ?? 0, (s.blocked ? "r" : "")],
    ["Throttled", s.throttled ?? 0, (s.throttled ? "y" : "")],
    ["Protected", s.protected ?? 0, "b"],
    ["Policies", (s.active_policies ?? 0) + " / " + (s.policies ?? 0), ""],
    ["Throughput", fmtBps((s.rx_bps_total || 0) + (s.tx_bps_total || 0)), "g"],
    ["Events", s.events ?? 0, ""],
  ];
  $("#stats").innerHTML = cells.map(([k, v, c]) =>
    `<div class="stat"><div class="k">${esc(k)}</div><div class="v ${c}">${esc(v)}</div></div>`).join("");

  const ap = $("#agentPill");
  const online = h.agent_online;
  ap.textContent = online
    ? `agent live · ${h.agent_count || 1}`
    : (h.reports ? "agent silent" : "no agent");
  ap.className = "pill " + (online ? "on" : "off");
}

function renderBanners() {
  const h = S.health || {};
  const out = [];
  if (!h.agent_online) {
    out.push(`<div class="banner bad"><strong>Enforcement is inactive.</strong>
      No data-plane agent has reported in the last 30 seconds. The dashboard still records intent,
      but nothing is being applied on the wire. Start <code>netcut-agent</code> on the host that owns the segment.</div>`);
  }
  if (S.user && S.user.role === "viewer") {
    out.push(`<div class="banner warn">You are signed in as a <strong>viewer</strong>: the controls below are read-only.</div>`);
  }
  // Explain a missing link label rather than leaving the column blank.
  const rt = S.router || {};
  if (!rt.configured) {
    out.push(`<div class="banner warn"><strong>Link information is unavailable.</strong>
      Nothing is polling the router, so devices cannot be labelled <code>wlan</code> or <code>lan</code>.
      Set <code>NETCUT_ROUTER_HOST</code> (and the router credentials) to enable it.</div>`);
  } else if (rt.last_error) {
    out.push(`<div class="banner warn"><strong>Router polling is failing.</strong>
      <span class="mono">${esc(rt.backend || "")}</span> at <span class="mono">${esc(rt.host || "")}</span>:
      ${esc(rt.last_error)}</div>`);
  }
  const scheduled = S.policies.filter((p) => p.enabled && p.schedule);
  if (scheduled.length) {
    const t = new Date();
    out.push(`<div class="banner warn">${scheduled.length} scheduled policy(ies) configured —
      the first match per device wins, highest priority first.
      Current local time ${String(t.getHours()).padStart(2, "0")}:${String(t.getMinutes()).padStart(2, "0")}.</div>`);
  }
  $("#banners").innerHTML = out.join("");
}

function decisionOf(mac) {
  return S.decisions[mac] || { action: "allow", source: "default", reason: "—" };
}

/* linkCell renders how a device is attached: Wi-Fi with its SSID and band, or a
   wired port. It shows an explicit "unknown" marker rather than a blank, so a
   missing router integration is visible instead of looking like an empty field. */
function linkCell(d) {
  const c = d.connection || {};
  const kind = c.kind || "";
  if (!kind || kind === "unknown") {
    const hint = S.router && S.router.configured
      ? "router polling is configured but has not reported this device"
      : "set NETCUT_ROUTER_HOST to label devices as wlan or lan";
    return `<span class="pill unknown" title="${esc(hint)}">unknown</span>`;
  }
  const cls = ["wlan", "lan", "wan", "virtual"].includes(kind) ? kind : "unknown";
  const label = c.kind === "wlan"
    ? (c.detail || "wlan") + (c.band ? " · " + c.band : "")
    : (c.port || c.detail || kind);

  const extra = [];
  if (c.rate)   extra.push(c.rate);
  if (c.signal) extra.push(c.signal);
  if (c.source) extra.push("via " + c.source);

  return `<span class="pill ${cls}" title="${esc(extra.join(" · "))}">${esc(label)}</span>`
    + (extra.length ? `<div class="hint">${esc(extra.join(" · "))}</div>` : "");
}

function renderDevices() {
  const q = ($("#filter").value || "").toLowerCase().trim();
  const rows = S.devices
    .slice()
    .sort((a, b) => (b.online - a.online) || a.mac.localeCompare(b.mac))
    .filter((d) => {
      if (!q) return true;
      return [d.alias, d.hostname, d.vendor, d.ip, d.mac, d.group, d.note,
              (d.connection || {}).kind, (d.connection || {}).detail,
              (d.connection || {}).port]
        .filter(Boolean).join(" ").toLowerCase().includes(q);
    });

  const tb = $("#devices");
  if (!rows.length) {
    tb.innerHTML = `<tr><td colspan="11" class="empty">${
      S.devices.length ? "No device matches the filter." : "No devices discovered yet."}</td></tr>`;
    return;
  }

  const editable = S.user && S.user.role !== "viewer";

  tb.innerHTML = rows.map((d) => {
    const dec = decisionOf(d.mac);
    const ov = S.overrides[d.mac];
    const name = d.alias || d.hostname || d.vendor || d.mac;
    const total = (d.rx_bps || 0) + (d.tx_bps || 0);
    const pct = Math.min(100, Math.round((total / (12.5e6)) * 100));
    const cls = [d.online ? "" : "off", d.protected ? "protected" : "", dec.action === "block" ? "blocked" : ""].join(" ");
    const actPill = { block: "block", throttle: "throttle", observe: "observe", allow: "allow" }[dec.action] || "allow";
    const first = (d.first_seen || "").slice(0, 10);
    const sess = d.online && d.last_seen ? "up " + ago(d.last_seen) : "since " + (first || "—");

    return `<tr class="${cls}" data-mac="${esc(d.mac)}">
      <td>
        <div style="display:flex;align-items:center;gap:7px">

function renderEvents() {
  const box = $("#eventsList");
  if (!box) return;
  if (!S.events.length) { box.innerHTML = `<div class="empty">No activity recorded.</div>`; return; }
  box.innerHTML = S.events.map((e) =>
    `<div class="e ${esc(e.severity)}">
      <span class="t">${esc(clock(e.ts))}</span>
      <span class="grow">${esc(e.message)}${e.actor ? ` <span class="hint">— ${esc(e.actor)}</span>` : ""}</span>
    </div>`).join("");
}

/* ------------------------------------------------------------------ device actions */
document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const mac = btn.dataset.mac;
  const act = btn.dataset.act;
  const dev = S.devices.find((d) => d.mac === mac);
  if (!dev) return;

  try {
    if (act === "block")   return void openBlock(mac, dev);
    if (act === "throttle") return void openThrottle(mac, dev);
    if (act === "edit")    return void openEdit(mac, dev);
    if (act === "allow") {
      await api("/devices/" + encodeURIComponent(mac) + "/action", {
        method: "POST", body: { action: "allow" },
      });
      toast("Released " + (dev.alias || dev.mac), "ok");
      refresh();
      return;
    }
    if (act === "protect") {
      await api("/devices/" + encodeURIComponent(mac), {
        method: "PATCH", body: { protected: !dev.protected },
      });
      toast(dev.protected ? "Protection removed" : "Device protected — now exempt from all enforcement", "ok");
      refresh();
      return;
    }
  } catch (err) {
    toast(err.message, "bad");
  }
});

function closeModal() { $("#modals").innerHTML = ""; }
function openModal(html) {
  $("#modals").innerHTML = `<div class="modal">${html}</div>`;
  const m = $(".modal");
  m.addEventListener("click", (e) => { if (e.target === m) closeModal(); });
  $$(".modal [data-close]").forEach((b) => b.addEventListener("click", closeModal));
  const f = $(".modal form");
  if (f) f.addEventListener("submit", (e) => e.preventDefault());
}

function openBlock(mac, dev) {
  openModal(`<div class="card">
    <h3>Block ${esc(dev.alias || dev.hostname || dev.mac)}</h3>
    <div class="sub mono">${esc(dev.ip || "")} ${esc(dev.mac)}</div>
    <p class="hint">The device keeps its link but its traffic stops. Nothing is changed on the device itself,
    and it recovers automatically when released.</p>
    <label>Duration</label>
    <select id="dur">
      <option value="0">Until I release it</option>
      <option value="900">15 minutes</option>

function openThrottle(mac, dev) {

    <label>Bandwidth cap</label>

    <select id="dur">
      <option value="0">Until I release it</option>

function openEdit(mac, dev) {

/* ------------------------------------------------------------------ policies */

      A protected device is always exempt, whatever the rules say.</div>

      <div><label>Action</label>
        <select id="pAction">
          <option value="throttle">Throttle</option>

          <option value="observe">Observe only</option>
          <option value="allow">Allow (exempt)</option>

      <div><label>Schedule</label>
        <select id="pPreset">${PRESETS.map(([l, v], i) =>
          `<option value="${esc(v)}" ${i === PRESETS.length - 1 ? "selected" : ""}>${esc(l)}</option>`).join("")}
        </select>
        <input id="pSchedule" placeholder="22:00-06:00 or a cron expression" style="margin-top:6px"></div>

/* ------------------------------------------------------------------ agents */
async function openAgents() {
  let tokens = [], runtime = [];
  try {
    const r = await api("/agents");
    tokens = r.tokens || [];
    runtime = r.runtime || [];
  } catch (err) { toast(err.message, "bad"); return; }
  const owner = S.user.role === "owner";

  openModal(`<div class="card" style="width:min(760px,96vw)">
    <h3>Data-plane agents</h3>
    <div class="sub">An agent runs on the host that owns the segment and performs the actual
      enforcement. The container cannot do this itself: a NAT-ed container has no layer-2 reach.</div>

    <div class="tw"><table>
      <thead><tr><th>Name</th><th>Created</th><th>Last seen</th><th>State</th><th></th></tr></thead>
      <tbody>${tokens.length ? tokens.map((t) => `<tr>
        <td><strong>${esc(t.name)}</strong><div class="hint mono">${esc(t.id)}</div></td>
        <td class="hint">${esc(ago(t.created_at))}</td>
        <td class="hint">${esc(ago(t.last_seen))}</td>
        <td><span class="pill ${t.revoked ? "block" : "on"}">${t.revoked ? "revoked" : "active"}</span></td>
        <td>${owner && !t.revoked ? `<button class="btn sm danger" data-revoke="${esc(t.id)}">Revoke</button>` : ""}</td>
      </tr>`).join("") : `<tr><td colspan="5" class="empty">No agent credentials yet.</td></tr>`}</tbody>
    </table></div>

    ${runtime.length ? `<h3 style="margin-top:20px;font-size:14px">Reporting now</h3>
      ${runtime.map((a) => `<div class="kv" style="margin-bottom:10px">
        <span class="k">agent</span><span>${esc(a.name)} <span class="hint mono">${esc(a.agent_id)}</span></span>
        <span class="k">interface</span><span class="mono">${esc(a.iface)} · ${esc(a.local_ip)} · ${esc(a.local_mac)}</span>
        <span class="k">segment</span><span class="mono">${esc(a.subnet)} via ${esc(a.gateway)}</span>
        <span class="k">elevated</span><span>${a.elevated ? "yes" : "<strong>no — enforcement will fail</strong>"}
          · layer-2 ${a.cap_arp ? "available" : "unavailable"}</span>
      </div>`).join("")}` : `<p class="hint" style="margin-top:16px">No agent has ever reported. Start one with the command below.</p>`}

    ${owner ? `
      <h3 style="margin-top:20px;font-size:14px">Issue a credential</h3>
      <label>Name</label><input id="aName" placeholder="e.g. gateway-host">
      <div class="row" style="margin-top:14px"><button class="btn primary" id="aAdd">Create</button></div>
      <div id="aOut"></div>
    ` : ""}

    <h3 style="margin-top:20px;font-size:14px">How to run an agent</h3>
    <pre class="mono" style="background:var(--bg3);padding:11px;border-radius:8px;overflow:auto;font-size:12px">netcut-agent -check
netcut-agent -server ${esc(location.origin)} -token &lt;credential&gt;</pre>
    <p class="hint">Run it from an elevated prompt on the host on the segment. On Windows it needs Npcap
      (installed with Wireshark). Use <code>-dry-run</code> first to confirm discovery without enforcement.</p>

    <div class="row" style="margin-top:16px"><button class="btn" data-close>Close</button></div>
  </div>`);

  $("#aAdd")?.addEventListener("click", async () => {
    try {
      const r = await api("/agents", { method: "POST", body: { name: $("#aName").value || "agent" } });
      $("#aOut").innerHTML = `<div class="banner warn" style="margin-top:14px;border-radius:8px">
        Copy this credential now — it is shown once and only its digest is stored.
      </div>
      <pre class="mono" style="background:var(--bg3);padding:11px;border-radius:8px;overflow:auto;font-size:12px">${esc(r.token)}</pre>`;
    } catch (err) { toast(err.message, "bad"); }
  });

  $$("[data-revoke]").forEach((b) => b.addEventListener("click", async () => {
    if (!confirm("Revoke this credential? The agent using it stops working immediately.")) return;
    try {
      await api("/agents/" + b.dataset.revoke, { method: "DELETE" });
      closeModal(); toast("Credential revoked", "ok");
    } catch (err) { toast(err.message, "bad"); }
  }));
}

$("#btnUsers").addEventListener("click", openUsers);
$("#btnPassword").addEventListener("click", openPassword);
$("#filter").addEventListener("input", renderDevices);

$("#btnRescan").addEventListener("click", async () => {
  const btn = $("#btnRescan");
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span> scanning';
  try {
    const r = await api("/agents");
    const rt = (r.runtime || [])[0];
    toast(rt ? "The agent sweeps the segment on its own interval; refresh in a moment."
             : "No agent is reporting, so nothing can be discovered.", rt ? "" : "bad");
  } catch (err) { toast(err.message, "bad"); }
  finally { setTimeout(() => { btn.disabled = false; btn.textContent = "Rescan"; }, 1200); }
});

$("#btnPanic").addEventListener("click", async () => {
  if (!confirm("Release every device and disable all policies?\n\nAll enforcement stops immediately and the segment returns to normal.")) return;
  try {
    const r = await api("/panic", { method: "POST" });
    toast("Released " + r.released + " device(s); all policies disabled", "ok");
    refresh();
  } catch (err) { toast(err.message, "bad"); }
});

document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

/* ------------------------------------------------------------------ boot */
(async function boot() {
  try {
    const r = await api("/auth/me");
    S.user = r.user;
    startApp();
  } catch {
    $("#login").classList.remove("hide");
    $("#email").focus();
  }
})();
</script>
</body>
</html>
